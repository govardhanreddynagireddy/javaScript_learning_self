<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Conditional Operators</h1>
    <script>
        let age=20;
        if(age>18){
            console.log("You are eligible for vote");
        }
        else{
            console.log('you are not eligible..');
        }
        // if else if else statements
        let marks = 85;

        if (marks >= 90) {
            console.log("Grade A");
        } else if (marks >= 75) {
            console.log("Grade B");
        } else if (marks >= 50) {
            console.log("Grade C");
        } else {
            console.log("Fail");
        }
        // String value is true it is used as boolean in the if
        let name = "Govardhan";

        if (name) {
             console.log("Name exists");
        }

        //Empty string is always the false
         name = "";

        if (name) {
            console.log("Name exists");
        } else {
            console.log("Name is empty");
        }
        //Nested if 
        age = 20;
        let hasID = true;

        if (age >= 18) {
            if (hasID) {
                console.log("Entry allowed");
            } else {
                console.log("ID required");
            }
        } else {
            console.log("Underage");
        }


    </script>
</body>
</html>
