<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Operators in js</h1>
    <script>
        let a = 10;
        let b = 3;

        console.log(a % b);
        console.log(a > b);
        console.log(a === "10");

        let x = 5;
        console.log(x++);
        console.log(x);

        console.log(true && false);
        console.log(true || false);
        console.log(!true);
    </script>
</body>
</html>
