<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Week-2 day-1 </h1>
   <h2>Switch case </h2> 
   <script>
    let day="2";
    switch(day){
        case "1":
            console.log("Monday");
            break;
        case "2":
            console.log("Tuesday");
            break;

        case "3":
            console.log("Wednesday");
            break;
        default:
            console.log("Invalid day");
    }
    //4. Multiple cases for the same action
       day="3";
    switch(day){
        case "1":
            console.log("Monday");
            break;
        case "2":
        case "3":
            console.log("Tuesday");
            console.log("Wednesday");
            break;
        default:
            console.log("Invalid day");
    }
   </script>
</body>
</html>
